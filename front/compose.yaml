# Ambiente de desenvolvimento do front: ng serve com hot reload.
# Uso: docker compose up (http://localhost:4200). A API é um projeto à parte (back/ ou o compose da raiz).
services:
  web:
    build: .
    working_dir: /app
    # O node_modules do Windows não serve no container: ele fica num volume e é reinstalado
    # quando o package-lock.json muda.
    command:
      - sh
      - -c
      - >-
        (md5sum package-lock.json | cmp -s - node_modules/.lock-stamp ||
        (npm ci && md5sum package-lock.json > node_modules/.lock-stamp)) &&
        npx ng serve --host 0.0.0.0 --poll 1000
    ports:
      - "4200:4200"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
    name: denarius-front-node-modules
