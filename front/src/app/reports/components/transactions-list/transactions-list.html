<app-report-card
	[heading]="heading()"
	[report]="transactions()"
	[empty]="empty()"
	errorText="Não foi possível carregar as transações do mês."
	(retry)="retry.emit()"
>
	<ng-template>
		<div class="scroll">
			<table mat-table [dataSource]="latest()">
				<ng-container matColumnDef="date">
					<th mat-header-cell *matHeaderCellDef>Data</th>
					<td mat-cell *matCellDef="let transaction">{{ transaction.date | date: 'dd/MM' : 'UTC' }}</td>
				</ng-container>

				<ng-container matColumnDef="description">
					<th mat-header-cell *matHeaderCellDef>Descrição</th>
					<td mat-cell *matCellDef="let transaction">
						<div>{{ transaction.description ?? transaction.categoryName }}</div>
						@if (transaction.description) {
							<div class="category">{{ transaction.categoryName }}</div>
						}
					</td>
				</ng-container>

				<ng-container matColumnDef="amount">
					<th mat-header-cell *matHeaderCellDef align="end">Valor</th>
					<td mat-cell *matCellDef="let transaction" align="end" [class.negative]="transaction.type === 'out'">
						{{ signedAmount(transaction) | currency: 'BRL' }}
					</td>
				</ng-container>

				<tr mat-header-row *matHeaderRowDef="columns; sticky: true"></tr>
				<tr mat-row *matRowDef="let row; columns: columns"></tr>
			</table>
		</div>
		<a matButton routerLink="/transactions" [queryParams]="monthFilter()">Ver todas</a>
	</ng-template>
</app-report-card>
