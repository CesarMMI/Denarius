<app-page-header
	greeting="Classificação"
	title="Categorias"
	actionLabel="Categoria"
	[showSearchIcon]="true"
	[showFilterButton]="true"
	[filtersActive]="hasActiveFilters()"
	[monthLabel]="monthLabel()"
	monthTag="opcional"
	[chips]="chipLabels()"
	(action)="openCreateForm()"
	(openFilters)="openFilters()"
	(openMonth)="openMonthPicker()"
	(removeChip)="removeChip($event)"
/>

<div class="content">
	@if (categoriesResource.isLoading()) {
		<mat-progress-bar mode="indeterminate" class="loading" />
	}

	@if (categoriesResource.error()) {
		<app-empty-state
			icon="cloud_off"
			title="Não foi possível carregar as categorias"
			body="Verifique sua conexão e tente novamente."
			primaryLabel="Tentar novamente"
			(primaryAction)="reload()"
		/>
	} @else if (categories().length > 0) {
		<app-category-list [categories]="categories()" (openCategory)="openCategory($event)" (openMenu)="openMenu($event)" />
	} @else if (!categoriesResource.isLoading()) {
		<app-empty-state
			icon="sell"
			title="Nenhuma categoria encontrada"
			body="Crie uma categoria para começar a classificar seus lançamentos."
			primaryLabel="Nova categoria"
			(primaryAction)="openCreateForm()"
		/>
	}
</div>
