<table
	mat-table
	[dataSource]="rows()"
	matSort
	matSortDisableClear
	[matSortActive]="sort().active"
	[matSortDirection]="sort().direction"
	(matSortChange)="sort.set($event)"
>
	<ng-container matColumnDef="name">
		<th mat-header-cell *matHeaderCellDef mat-sort-header="name">Nome</th>
		<td mat-cell *matCellDef="let category">
			<mat-chip [appMatChipColor]="category.color">
				{{ category.name }}
			</mat-chip>
		</td>
	</ng-container>

	<ng-container matColumnDef="transactionCount">
		<th mat-header-cell *matHeaderCellDef mat-sort-header="transactionCount" arrowPosition="before">Transações</th>
		<td mat-cell *matCellDef="let category" align="end">
			<a routerLink="/transactions" [queryParams]="{ categoryId: category.id }">{{ category.transactionCount }}</a>
		</td>
	</ng-container>

	<ng-container matColumnDef="balance">
		<th mat-header-cell *matHeaderCellDef mat-sort-header="balance" arrowPosition="before">Saldo</th>
		<td mat-cell *matCellDef="let category" align="end" [class.negative]="category.balance < 0">
			{{ category.balance | currency: 'BRL' }}
		</td>
	</ng-container>

	<ng-container matColumnDef="actions">
		<th mat-header-cell *matHeaderCellDef></th>
		<td mat-cell *matCellDef="let category" align="end">
			<button matIconButton aria-label="Editar" matTooltip="Editar" (click)="edit.emit(category)">
				<mat-icon>edit</mat-icon>
			</button>
			<!-- disabledInteractive keeps the tooltip working; the click still fires, hence the guard. -->
			<button
				matIconButton
				aria-label="Excluir"
				[matTooltip]="
					category.canDelete ? 'Excluir' : 'Não é possível excluir uma categoria com transações, mesmo que em outros meses.'
				"
				[disabled]="!category.canDelete"
				disabledInteractive
				(click)="category.canDelete && delete.emit(category)"
			>
				<mat-icon>delete</mat-icon>
			</button>
		</td>
	</ng-container>

	<tr mat-header-row *matHeaderRowDef="columns"></tr>
	<tr mat-row *matRowDef="let row; columns: columns"></tr>
	<tr class="mat-mdc-row" *matNoDataRow>
		<td class="mat-mdc-cell mdc-data-table__cell" [attr.colspan]="columns.length">
			@if (categories().isLoading()) {
				<mat-progress-spinner diameter="24" />
			} @else if (categories().error()) {
				Não foi possível carregar as categorias.
			} @else {
				Nenhuma categoria encontrada.
			}
		</td>
	</tr>
</table>
