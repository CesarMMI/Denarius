<h2 mat-dialog-title>{{ category ? 'Editar categoria' : 'Nova categoria' }}</h2>

<mat-dialog-content>
	<form id="category-form" [formGroup]="form" (ngSubmit)="submit()">
		<mat-form-field>
			<mat-label>Nome</mat-label>
			<input matInput formControlName="name" [maxlength]="nameMaxLength" />
			<mat-hint align="end">{{ form.controls.name.value.length }}/{{ nameMaxLength }}</mat-hint>
			<mat-error>Informe um nome</mat-error>
		</mat-form-field>

		<div class="colors" role="group" aria-label="Cor">
			@for (color of colors(); track color) {
				<button
					type="button"
					[style.background]="color"
					[attr.aria-label]="color"
					[attr.aria-pressed]="form.controls.color.value === color"
					(click)="form.controls.color.setValue(color)"
				>
					@if (form.controls.color.value === color) {
						<mat-icon>check</mat-icon>
					}
				</button>
			}
			<input type="color" formControlName="color" title="Cor personalizada" aria-label="Cor personalizada" />
		</div>
	</form>
</mat-dialog-content>

<mat-dialog-actions>
	<button matButton mat-dialog-close>Cancelar</button>
	<button matButton="filled" type="submit" form="category-form">Salvar</button>
</mat-dialog-actions>
