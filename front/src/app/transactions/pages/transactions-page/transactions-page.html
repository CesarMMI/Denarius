<app-page-header text="Transações">
	<button matIconButton aria-label="Recarregar" matTooltip="Recarregar" (click)="reload()">
		<mat-icon>refresh</mat-icon>
	</button>
	<button
		matIconButton
		[attr.aria-label]="filtersVisible() ? 'Ocultar filtros' : 'Exibir filtros'"
		[matTooltip]="filtersVisible() ? 'Ocultar filtros' : 'Exibir filtros'"
		(click)="filtersVisible.set(!filtersVisible())"
	>
		@if (filtersVisible()) {
			<mat-icon>filter_alt_off</mat-icon>
		} @else {
			<mat-icon>filter_alt</mat-icon>
		}
	</button>
	<app-sort-menu [options]="sortOptions" [(sort)]="sort" />
	<button matButton="filled" (click)="openForm()">
		<mat-icon>add</mat-icon>
		<span>Nova transação</span>
	</button>
</app-page-header>

@if (filtersVisible()) {
	<mat-card class="filters">
		<app-transactions-filters [(filters)]="filters" [categories]="categoryList()" />
	</mat-card>
}

<mat-card class="table">
	<app-transactions-table
		[transactions]="transactions"
		[categories]="categories"
		(edit)="openForm($event)"
		(delete)="delete($event)"
	/>
</mat-card>
