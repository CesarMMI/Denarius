# Mesclado automaticamente pelo Compose quando você roda `docker compose up`
# de dentro de api/ (sem -f). Não existe "modo prod" via este arquivo — produção
# roda `docker compose -f docker-compose.yml up` (só o base, sem o override).
#
# Em dev, só o MariaDB sobe via Docker (`docker compose up mariadb`) — a API
# roda nativa com `dotnet watch run`, lendo config de appsettings.Development.json
# (commitado direto — sem segredo real, só uma senha fixa de dev). A senha abaixo é
# fixa de propósito (não vem do `.env`) pra não exigir sincronizar dois arquivos.
#
# Pra validar a imagem/Dockerfile antes de um deploy, use o compose de produção
# direto (`docker compose -f docker-compose.yml up --build`), que é autoconsistente
# com o seu `.env` — não use este override pra isso.
services:
  mariadb:
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: root
