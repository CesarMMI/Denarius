services:
  mariadb:
    image: mariadb:12.3-noble
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-denarius}
    volumes:
      - denarius-mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-uroot", "-p${MARIADB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    volumes:
      - ./src/Denarius.Api/appsettings.json:/app/appsettings.json:ro
    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  denarius-mariadb-data:
