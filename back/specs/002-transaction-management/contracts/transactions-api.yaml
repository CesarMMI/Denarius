openapi: 3.0.3
info:
  title: Denarius Transactions API
  description: >
    Contract for the existing Transaction management endpoints, as implemented by
    Denarius.WebAPI.Controllers.TransactionsController. Documents shipped behavior; not a
    proposal. 1.1.0 (2026-09-24) added the optional List query parameters (additive change).
  version: "1.1.0"
paths:
  /api/transactions:
    get:
      summary: List transactions
      operationId: listTransactions
      description: >
        Returns every transaction matching all of the given filters, in the requested order.
        With no parameters, returns every recorded transaction, most recent first. No
        pagination.
      parameters:
        - name: description
          in: query
          required: false
          schema:
            type: string
          description: >
            Partial, case-insensitive match against Transaction.description (trimmed; blank is
            ignored). Transactions with no description never match.
        - name: dateRef
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Any date within the calendar month to keep transactions from.
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TransactionType'
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Keep only transactions of this category.
        - name: orderBy
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TransactionOrderField'
        - name: asc
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Transactions matching the given filters, in the requested order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionOutput'
        '400':
          description: >
            Unknown type or orderBy value, or a malformed categoryId (model-binding validation
            problem produced by [ApiController]).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    post:
      summary: Create a transaction
      operationId: createTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionInput'
      responses:
        '201':
          description: Transaction created.
          headers:
            Location:
              schema:
                type: string
              description: "/api/transactions/{id}"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionOutput'
        '400':
          description: Invalid date, value, or description.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: The referenced category does not exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/transactions/{id}:
    get:
      summary: Get a transaction by id
      operationId: getTransactionById
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          description: The transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionOutput'
        '404':
          description: No transaction exists with the given id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    put:
      summary: Update a transaction
      operationId: updateTransaction
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTransactionInput'
      responses:
        '200':
          description: Transaction updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionOutput'
        '400':
          description: Invalid date, value, or description.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No transaction exists with the given id, or the referenced category does not exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      summary: Delete a transaction
      operationId: deleteTransaction
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      responses:
        '204':
          description: Transaction deleted. Never blocked by other data.
        '404':
          description: No transaction exists with the given id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  parameters:
    TransactionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    TransactionType:
      type: string
      enum: [All, In, Out]
      default: All
      description: >
        All = no filter; In = value > 0 (money received); Out = value < 0 (money spent). Bound
        case-insensitively, so all/in/out are accepted.
    TransactionOrderField:
      type: string
      enum: [Date, Description, Value, CategoryName]
      default: Date
      description: Value sorts by the signed value; CategoryName sorts by the category's current name.
    TransactionOutput:
      type: object
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        description:
          type: string
          nullable: true
        date:
          type: string
          format: date-time
        value:
          type: number
          format: decimal
          description: Positive (money received) or negative (money spent); never zero.
        categoryId:
          type: string
          format: uuid
      required: [id, createdAt, updatedAt, date, value, categoryId]
    CreateTransactionInput:
      type: object
      properties:
        description:
          type: string
          nullable: true
          maxLength: 255
        date:
          type: string
          format: date-time
        value:
          type: number
          format: decimal
          description: Must not be zero.
        categoryId:
          type: string
          format: uuid
          description: Must reference an existing category.
      required: [date, value, categoryId]
    UpdateTransactionInput:
      type: object
      properties:
        description:
          type: string
          nullable: true
          maxLength: 255
        date:
          type: string
          format: date-time
        value:
          type: number
          format: decimal
        categoryId:
          type: string
          format: uuid
      required: [date, value, categoryId]
    ProblemDetails:
      type: object
      description: RFC 7807 problem details, as produced by GlobalExceptionHandler.
      properties:
        status:
          type: integer
        title:
          type: string
        detail:
          type: string
