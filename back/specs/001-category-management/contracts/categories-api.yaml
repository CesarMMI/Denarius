openapi: 3.0.3
info:
  title: API de categorias do Denarius
  description: >
    Contrato dos endpoints existentes de gestão de categorias, como implementados por
    Denarius.WebAPI.Controllers.CategoriesController. Documenta o comportamento entregue; não é uma proposta.
  version: "1.0.0"
paths:
  /api/categories:
    get:
      summary: Listar categorias
      operationId: listCategories
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Busca parcial em Category.Name; a diferenciação entre maiúsculas e minúsculas depende do banco.
        - name: withTransaction
          in: query
          required: false
          schema:
            type: boolean
          description: true = só categorias com pelo menos uma transação; false = só categorias sem nenhuma.
        - name: dateRef
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Qualquer data dentro do mês do calendário ao qual transactionCount/balance devem se restringir.
        - name: orderBy
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/CategoryOrderField'
            default: name
        - name: asc
          in: query
          required: false
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Categorias que atendem aos filtros informados, na ordem pedida.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryOutput'
    post:
      summary: Criar uma categoria
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryInput'
      responses:
        '201':
          description: Categoria criada.
          headers:
            Location:
              schema:
                type: string
              description: "/api/categories/{id}"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryOutput'
        '400':
          description: Nome ou cor inválidos.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/categories/{id}:
    put:
      summary: Atualizar uma categoria
      operationId: updateCategory
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryInput'
      responses:
        '200':
          description: Categoria atualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryOutput'
        '400':
          description: Nome ou cor inválidos.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Não existe categoria com o id informado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      summary: Excluir uma categoria
      operationId: deleteCategory
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '204':
          description: Categoria excluída.
        '400':
          description: A categoria tem uma ou mais transações associadas.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Não existe categoria com o id informado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  parameters:
    CategoryId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    CategoryOrderField:
      type: string
      enum: [name, transactionCount, balance]
    CategoryOutput:
      type: object
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        name:
          type: string
        color:
          type: string
          description: Cor hexadecimal normalizada, por exemplo "#FF0000".
        transactionCount:
          type: integer
        balance:
          type: number
          format: decimal
        canDelete:
          type: boolean
          description: É false quando a categoria tem transações em algum mês, independentemente do dateRef.
      required: [id, createdAt, updatedAt, name, color, transactionCount, balance, canDelete]
    CreateCategoryInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        color:
          type: string
          description: Cor hexadecimal, com ou sem "#" inicial; 3 ou 6 dígitos.
      required: [name, color]
    UpdateCategoryInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        color:
          type: string
      required: [name, color]
    ProblemDetails:
      type: object
      description: Problem details da RFC 7807, como gerados pelo GlobalExceptionHandler.
      properties:
        status:
          type: integer
        title:
          type: string
        detail:
          type: string
