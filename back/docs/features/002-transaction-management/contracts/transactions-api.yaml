openapi: 3.0.3
info:
  title: API de transações do Denarius
  description: >
    Contrato dos endpoints existentes de gestão de transações, como implementados por
    Denarius.WebAPI.Controllers.TransactionsController. Documenta o comportamento entregue; não é
    uma proposta. A 1.1.0 (2026-09-24) adicionou os parâmetros de query opcionais do List (mudança aditiva).
    A 1.2.0 (2026-10-09) documenta a faixa e a escala do valor na criação e na edição, que antes
    respondiam 500 ou gravavam um valor diferente do enviado (back/bugs/valor-sem-faixa-e-escala).
    A 1.3.0 (alteração de 2026-10-11 da feature 002) faz a busca por descrição ignorar também os acentos e fixa a ordem alfabética das
    descrições e dos nomes de categoria no português do Brasil, igual em qualquer ambiente. Os parâmetros, as
    respostas e o formato não mudam (mudança compatível: nenhum consumidor precisa mudar).
  version: "1.3.0"
paths:
  /api/transactions:
    get:
      summary: Listar transações
      operationId: listTransactions
      description: >
        Devolve todas as transações que atendem a todos os filtros informados, na ordem pedida.
        Sem parâmetros, devolve todas as transações registradas, das mais recentes para as mais
        antigas. Sem paginação.
      parameters:
        - name: description
          in: query
          required: false
          schema:
            type: string
          description: >
            Busca parcial em Transaction.description, sem diferenciar maiúsculas de minúsculas nem
            letras acentuadas das sem acento (com trim; em branco é ignorada). `%`, `_` e `\` são
            procurados como texto. Transações sem descrição nunca aparecem.
        - name: dateRef
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: >
            Qualquer data dentro do mês do calendário cujas transações devem ser mantidas: do início do
            mês, inclusive, ao início do mês seguinte, exclusive.
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TransactionType'
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Mantém só as transações desta categoria.
        - name: orderBy
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TransactionOrderField'
          description: >-
            Ordena a lista inteira. Empates são desfeitos pela data mais recente e depois pelo
            horário de criação; ordenando por `date`, eles seguem a direção dela. Descrições e nomes
            de categoria seguem a ordem alfabética do português do Brasil: comparam-se primeiro sem
            acentos e sem diferenciar maiúsculas, depois a letra sem acento vem antes da acentuada e,
            por fim, a minúscula antes da maiúscula ("agua", "Agua", "água", "Água", "Banana"). As
            transações sem descrição ficam no início na ordem crescente e no fim na decrescente.
        - name: asc
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Transações que atendem aos filtros informados, na ordem pedida.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionOutput'
        '400':
          description: >
            Valor desconhecido de type ou orderBy, ou um categoryId malformado (problema de
            validação do model binding produzido pelo [ApiController]).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    post:
      summary: Criar uma transação
      operationId: createTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionInput'
      responses:
        '201':
          description: Transação criada.
          headers:
            Location:
              schema:
                type: string
              description: "/api/transactions/{id}"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionOutput'
        '400':
          description: Data, valor ou descrição inválidos.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: A categoria referenciada não existe.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/transactions/{id}:
    put:
      summary: Atualizar uma transação
      operationId: updateTransaction
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTransactionInput'
      responses:
        '200':
          description: Transação atualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionOutput'
        '400':
          description: Data, valor ou descrição inválidos.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Não existe transação com o id informado, ou a categoria referenciada não existe.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      summary: Excluir uma transação
      operationId: deleteTransaction
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      responses:
        '204':
          description: Transação excluída. Nunca é bloqueada por outros dados.
        '404':
          description: Não existe transação com o id informado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  parameters:
    TransactionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    TransactionType:
      type: string
      enum: [all, in, out]
      default: all
      description: >
        All = sem filtro; In = value > 0 (dinheiro recebido); Out = value < 0 (dinheiro gasto). O
        binding não diferencia maiúsculas de minúsculas, então all/in/out são aceitos.
    TransactionOrderField:
      type: string
      enum: [date, description, value, categoryName]
      default: date
      description: Value ordena pelo valor com sinal; CategoryName ordena pelo nome atual da categoria.
    TransactionOutput:
      type: object
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        description:
          type: string
          nullable: true
        date:
          type: string
          format: date-time
        value:
          type: number
          format: decimal
          description: Positivo (dinheiro recebido) ou negativo (dinheiro gasto); nunca zero.
        categoryId:
          type: string
          format: uuid
      required: [id, createdAt, updatedAt, date, value, categoryId]
    CreateTransactionInput:
      type: object
      properties:
        description:
          type: string
          nullable: true
          maxLength: 255
        date:
          type: string
          format: date-time
        value:
          type: number
          format: decimal
          minimum: -9999999999999.99
          maximum: 9999999999999.99
          multipleOf: 0.01
          description: >
            Não pode ser zero, nem ter mais que duas casas decimais, nem passar de 9.999.999.999.999,99
            para mais ou para menos; fora disso, 400.
        categoryId:
          type: string
          format: uuid
          description: Precisa referenciar uma categoria existente.
      required: [date, value, categoryId]
    UpdateTransactionInput:
      type: object
      properties:
        description:
          type: string
          nullable: true
          maxLength: 255
        date:
          type: string
          format: date-time
        value:
          type: number
          format: decimal
          minimum: -9999999999999.99
          maximum: 9999999999999.99
          multipleOf: 0.01
          description: As mesmas regras da criação.
        categoryId:
          type: string
          format: uuid
      required: [date, value, categoryId]
    ProblemDetails:
      type: object
      description: Problem details da RFC 7807, como gerados pelo GlobalExceptionHandler.
      properties:
        status:
          type: integer
        title:
          type: string
        detail:
          type: string
