openapi: 3.0.3
info:
  title: API de relatórios do Denarius
  description: >
    Contrato dos relatórios financeiros, como implementados por
    Denarius.WebAPI.Controllers.ReportsController. Somente leitura; cada relatório cobre um mês do
    calendário, escrito YYYY-MM, e o padrão é o mês atual no fuso horário America/Sao_Paulo. Dinheiro
    é decimal e a despesa é sempre um valor positivo; os percentuais estão na escala 0-100,
    arredondados para duas casas decimais. As datas das transações são dias do calendário e nunca são
    deslocadas por fuso horário.
  # 1.1.0 (2026-10-09): lançamentos futuros na série acumulada e na projeção do mês atual; formato igual.
  version: "1.1.0"
paths:
  /api/reports/summary:
    get:
      summary: Resumo mensal
      operationId: getMonthlySummary
      description: >
        Totais do mês, a sua taxa de poupança, a projeção do fim do mês e a comparação com o mês
        anterior.
      parameters:
        - $ref: '#/components/parameters/Month'
      responses:
        '200':
          description: O resumo do mês.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlySummaryOutput'
        '400':
          $ref: '#/components/responses/InvalidMonth'
  /api/reports/expensesByCategory:
    get:
      summary: Despesas por categoria
      operationId: getExpensesByCategory
      description: >
        A despesa do mês por categoria, das maiores para as menores (empates pelo nome). Com mais de 8
        categorias, as 7 maiores são listadas e o resto é somado numa entrada final "Outras".
      parameters:
        - $ref: '#/components/parameters/Month'
      responses:
        '200':
          description: A despesa do mês por categoria.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpensesByCategoryOutput'
        '400':
          $ref: '#/components/responses/InvalidMonth'
  /api/reports/incomeVsExpense:
    get:
      summary: Receitas vs. despesas por mês
      operationId: getIncomeVsExpense
      description: >
        Uma entrada por mês, do mais antigo para o mais recente, para os `months` meses que terminam
        em `month`. Meses sem transações aparecem com zeros.
      parameters:
        - $ref: '#/components/parameters/Month'
        - name: months
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 24
            default: 12
          description: Quantos meses a série cobre, terminando em `month`.
      responses:
        '200':
          description: A série, em ordem cronológica.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IncomeVsExpenseOutput'
        '400':
          description: >
            `month` não é um mês YYYY-MM válido, ou `months` não é um número entre 1 e 24 (problema
            de validação do model binding produzido pelo [ApiController]).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
  /api/reports/cumulativeExpenses:
    get:
      summary: Despesa acumulada do mês vs. o mês anterior
      operationId: getCumulativeExpenseComparison
      description: >
        O total acumulado da despesa em cada dia do mês e do mês anterior. No mês atual, a série vai
        até o maior entre hoje e o último dia com despesa do mês (inclui despesas lançadas para depois
        de hoje); num mês passado, cobre o mês inteiro; num mês que ainda não começou, fica vazia.
      parameters:
        - $ref: '#/components/parameters/Month'
      responses:
        '200':
          description: As duas séries e a quantidade de dias de cada mês.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CumulativeExpenseComparisonOutput'
        '400':
          $ref: '#/components/responses/InvalidMonth'
  /api/reports/transactions:
    get:
      summary: Transações do mês
      operationId: listMonthlyTransactions
      description: >
        Todas as transações com data no mês — sem paginação, sem limite —, da data mais recente para a
        mais antiga e, depois, das registradas mais recentemente para as mais antigas.
      parameters:
        - $ref: '#/components/parameters/Month'
      responses:
        '200':
          description: As transações do mês.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MonthlyTransactionOutput'
        '400':
          $ref: '#/components/responses/InvalidMonth'
components:
  parameters:
    Month:
      name: month
      in: query
      required: false
      schema:
        type: string
        pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        example: '2026-09'
      description: >
        O mês do calendário, YYYY-MM. Omitido ou vazio: o mês atual em America/Sao_Paulo.
  responses:
    InvalidMonth:
      description: >
        `month` não é um mês YYYY-MM válido (problema de validação do model binding produzido pelo
        [ApiController]; o caso de uso não é chamado).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetails'
  schemas:
    MonthlySummaryOutput:
      type: object
      properties:
        month:
          type: string
          example: '2026-09'
        totalIncome:
          type: number
          format: decimal
          description: Soma das entradas do mês.
        totalExpense:
          type: number
          format: decimal
          description: Soma das saídas do mês, como valor positivo.
        balance:
          type: number
          format: decimal
          description: totalIncome - totalExpense.
        savingsRate:
          type: number
          format: decimal
          nullable: true
          description: >
            balance / totalIncome x 100, na escala 0-100 (negativa quando a despesa passa da
            receita). null quando o mês não tem receita.
        projectedExpense:
          type: number
          format: decimal
          description: >
            Mês atual: (despesa do dia 1 até hoje / dias decorridos (incluindo hoje) x dias do mês,
            arredondada para centavos) + despesa com data depois de hoje no mês (já exata em
            centavos). Mês passado: totalExpense. Mês futuro: 0.
        projectedBalance:
          type: number
          format: decimal
          description: >
            Mês atual: totalIncome - projectedExpense. Mês passado: balance. Mês futuro: 0.
        previousMonth:
          $ref: '#/components/schemas/PreviousMonthSummaryOutput'
      required: [month, totalIncome, totalExpense, balance, savingsRate, projectedExpense, projectedBalance, previousMonth]
    PreviousMonthSummaryOutput:
      type: object
      description: >
        O mês anterior ao mês do relatório e a variação percentual de cada um dos seus valores para os
        do mês do relatório: (current - previous) / |previous| x 100, null quando o valor anterior é 0.
      properties:
        totalIncome:
          type: number
          format: decimal
        totalExpense:
          type: number
          format: decimal
        balance:
          type: number
          format: decimal
        totalIncomeChange:
          type: number
          format: decimal
          nullable: true
        totalExpenseChange:
          type: number
          format: decimal
          nullable: true
        balanceChange:
          type: number
          format: decimal
          nullable: true
      required: [totalIncome, totalExpense, balance, totalIncomeChange, totalExpenseChange, balanceChange]
    ExpensesByCategoryOutput:
      type: object
      properties:
        total:
          type: number
          format: decimal
          description: A despesa total do mês.
        items:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/CategoryExpenseOutput'
      required: [total, items]
    CategoryExpenseOutput:
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
          nullable: true
          description: É null para "Outras".
        categoryName:
          type: string
          description: O nome da categoria, ou "Outras".
        color:
          type: string
          nullable: true
          example: '#43A047'
          description: A cor da categoria, ou null para "Outras".
        amount:
          type: number
          format: decimal
        percentage:
          type: number
          format: decimal
          description: amount / total x 100, na escala 0-100.
      required: [categoryId, categoryName, color, amount, percentage]
    IncomeVsExpenseOutput:
      type: object
      properties:
        month:
          type: string
          example: '2026-09'
        income:
          type: number
          format: decimal
        expense:
          type: number
          format: decimal
        balance:
          type: number
          format: decimal
          description: income - expense.
      required: [month, income, expense, balance]
    CumulativeExpenseComparisonOutput:
      type: object
      properties:
        currentMonth:
          type: array
          items:
            $ref: '#/components/schemas/AccumulatedExpenseOutput'
        previousMonth:
          type: array
          items:
            $ref: '#/components/schemas/AccumulatedExpenseOutput'
        daysInCurrentMonth:
          type: integer
        daysInPreviousMonth:
          type: integer
      required: [currentMonth, previousMonth, daysInCurrentMonth, daysInPreviousMonth]
    AccumulatedExpenseOutput:
      type: object
      properties:
        day:
          type: integer
          minimum: 1
          maximum: 31
        accumulated:
          type: number
          format: decimal
          description: A despesa do mês do dia 1 até este dia.
      required: [day, accumulated]
    MonthlyTransactionOutput:
      type: object
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date-time
          description: O dia do calendário, à meia-noite UTC (como em TransactionOutput).
        description:
          type: string
          nullable: true
        categoryName:
          type: string
        type:
          type: string
          enum: [in, out]
          description: in = entrada (valor positivo); out = saída (valor negativo).
        amount:
          type: number
          format: decimal
          description: O tamanho do valor, sempre positivo.
      required: [id, date, description, categoryName, type, amount]
    ValidationProblemDetails:
      type: object
      description: Problema de validação da RFC 7807, como produzido pelo [ApiController] para uma query inválida.
      properties:
        status:
          type: integer
        title:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
